apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
  namespace: kbark-demo
  labels: {app: node-agent}
spec:
  selector:
    matchLabels: {app: node-agent}
  template:
    metadata:
      labels: {app: node-agent}
    spec:
      terminationGracePeriodSeconds: 2
      tolerations:
        - {operator: Exists}
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "echo node agent v2 starting; echo \"FATAL: cannot open /host/proc: no such file or directory\"; exit 1"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}

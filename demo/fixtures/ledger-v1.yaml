apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ledger
  namespace: kbark-demo
  labels: {app: ledger}
spec:
  serviceName: ledger
  replicas: 2
  selector:
    matchLabels: {app: ledger}
  template:
    metadata:
      labels: {app: ledger}
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "echo ledger v1 serving; exec sleep 3600"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}

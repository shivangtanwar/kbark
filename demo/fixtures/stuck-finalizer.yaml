# A pod held by a finalizer nobody is going to remove. The scenario
# deletes it right after creating it, so it stays in Terminating.
apiVersion: v1
kind: Pod
metadata:
  name: export-7f6c9
  namespace: kbark-demo
  labels: {app: export}
  finalizers: [kbark.dev/demo-hold]
spec:
  terminationGracePeriodSeconds: 0
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "360000"]
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {memory: 64Mi}

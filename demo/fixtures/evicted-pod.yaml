# A stand-in for an evicted pod. Real evictions need a node under
# memory or disk pressure, which a one-node Kind cluster cannot produce
# safely. This pod is never scheduled (its node selector matches
# nothing); demo.sh then writes the same status the kubelet writes on
# eviction. kbark sees exactly what it would see after a real eviction.
apiVersion: v1
kind: Pod
metadata:
  name: cache-7c9d4-evicted
  namespace: kbark-demo
  labels: {app: cache}
spec:
  nodeSelector: {kbark.dev/never: "true"}
  terminationGracePeriodSeconds: 0
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "360000"]

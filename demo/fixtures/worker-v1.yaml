apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: kbark-demo
  labels: {app: worker}
spec:
  replicas: 2
  minReadySeconds: 5
  selector:
    matchLabels: {app: worker}
  template:
    metadata:
      labels: {app: worker}
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "echo worker started, polling queue; exec sleep 360000"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}

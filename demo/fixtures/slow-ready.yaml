apiVersion: apps/v1
kind: Deployment
metadata:
  name: search
  namespace: kbark-demo
  labels: {app: search}
spec:
  replicas: 1
  selector:
    matchLabels: {app: search}
  template:
    metadata:
      labels: {app: search}
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "echo search index loaded; exec sleep 3600"]
          # The health check takes two seconds to answer and is given one.
          readinessProbe:
            exec: {command: ["sh", "-c", "sleep 2; echo index ok"]}
            periodSeconds: 5
            timeoutSeconds: 1
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kbark-demo
  labels: {app: web}
spec:
  replicas: 2
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /www && echo ok > /www/index.html && exec httpd -f -p 8080 -h /www"]
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /, port: 8080}
            periodSeconds: 5
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: kbark-demo
spec:
  selector: {app: web}
  ports: [{port: 80, targetPort: 8080}]
---
# Three replicas. The "stuck-pod" scenario marks one pod's state as
# corrupt through a pod annotation, which the container sees through a
# downward-API file. Only that pod is affected, and a replacement pod
# starts clean.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sessions
  namespace: kbark-demo
  labels: {app: sessions}
spec:
  replicas: 3
  selector:
    matchLabels: {app: sessions}
  template:
    metadata:
      labels: {app: sessions}
    spec:
      terminationGracePeriodSeconds: 2
      volumes:
        - name: podinfo
          downwardAPI:
            items:
              - path: annotations
                fieldRef: {fieldPath: metadata.annotations}
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "echo opening /state/sessions.db; while ! grep -q 'kbark.dev/demo-state=\"corrupt\"' /podinfo/annotations 2>/dev/null; do sleep 2; done; echo \"FATAL: /state/sessions.db: checksum mismatch in page 12\"; exit 1"]
          volumeMounts:
            - {name: podinfo, mountPath: /podinfo}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}

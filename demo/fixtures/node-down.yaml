# Three replicas spread over the nodes, with a short toleration so
# that when a node stops, Kubernetes evicts its pod after 20 seconds
# instead of the default five minutes. The evicted pod then hangs in
# Terminating, because no kubelet is left to confirm it stopped.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge
  namespace: kbark-demo
  labels: {app: edge}
spec:
  replicas: 3
  selector:
    matchLabels: {app: edge}
  template:
    metadata:
      labels: {app: edge}
    spec:
      terminationGracePeriodSeconds: 2
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: edge}
      tolerations:
        - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 20}
        - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 20}
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "echo edge proxy up; exec sleep 3600"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}

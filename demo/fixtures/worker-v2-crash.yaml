apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: kbark-demo
  labels: {app: worker}
spec:
  replicas: 2
  minReadySeconds: 5
  selector:
    matchLabels: {app: worker}
  template:
    metadata:
      labels: {app: worker}
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: app
          image: busybox:1.36
          # Revision 2: a release that cannot parse its own configuration.
          command: ["sh", "-c", "echo loading /etc/worker/config.yaml; echo \"FATAL: config: unknown field retries_max at line 7\"; exit 1"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}

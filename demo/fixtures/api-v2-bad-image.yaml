apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: kbark-demo
  labels: {app: api}
spec:
  replicas: 2
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: app
          # Revision 2: a tag that was never pushed.
          image: busybox:1.36-does-not-exist
          command: ["sh", "-c", "echo api listening; exec sleep 360000"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}

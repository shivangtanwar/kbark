apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: kbark-demo
  labels: {app: checkout}
spec:
  replicas: 1
  selector:
    matchLabels: {app: checkout}
  template:
    metadata:
      labels: {app: checkout}
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /www && echo ok > /www/index.html && exec httpd -f -p 8080 -h /www"]
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
  namespace: kbark-demo
spec:
  # The pods are labelled app=checkout; this selector has a typo.
  selector: {app: check-out}
  ports: [{port: 80, targetPort: 8080}]

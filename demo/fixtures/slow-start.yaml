apiVersion: apps/v1
kind: Deployment
metadata:
  name: slow-start
  namespace: kbark-demo
  labels: {app: slow-start}
spec:
  replicas: 1
  selector:
    matchLabels: {app: slow-start}
  template:
    metadata:
      labels: {app: slow-start}
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: app
          image: busybox:1.36
          # Takes 25 seconds to start listening. The liveness probe gives it 5.
          command: ["sh", "-c", "echo warming caches; sleep 25; mkdir -p /www && echo ok > /www/index.html && echo listening on 8080 && exec httpd -f -p 8080 -h /www"]
          ports: [{containerPort: 8080}]
          livenessProbe:
            httpGet: {path: /, port: 8080}
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}

version: '3'

# Optional, never in the repository: API keys for local runs, for
# example KBARK_AI_API_KEY for an OpenAI-compatible profile.
dotenv: ['{{.HOME}}/.config/kbark/kbark.env']

vars:
  BINARY: kbark
  PKG: ./cmd/kbark
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo "dev"
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo "unknown"
  DATE:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ
  LDFLAGS: >-
    -s -w
    -X github.com/shivangtanwar/kbark/internal/version.Version={{.VERSION}}
    -X github.com/shivangtanwar/kbark/internal/version.Commit={{.COMMIT}}
    -X github.com/shivangtanwar/kbark/internal/version.Date={{.DATE}}

tasks:
  build:
    desc: Build the kbark binary into ./bin/
    cmds:
      - go build -trimpath -ldflags "{{.LDFLAGS}}" -o bin/{{.BINARY}} {{.PKG}}

  run:
    desc: Run kbark from source
    cmds:
      - go run -ldflags "{{.LDFLAGS}}" {{.PKG}} {{.CLI_ARGS}}

  ui:
    desc: Build the web console into internal/server/dist (needs Node 20+)
    dir: web
    cmds:
      - npm ci
      - npm run build

  ui-dev:
    desc: Run the web console with hot reload against a local `kbark serve`
    dir: web
    cmds:
      - npm run dev

  serve:
    desc: Run the autofix dashboard against the two demo Kind clusters
    cmds:
      - go run -ldflags "{{.LDFLAGS}}" {{.PKG}} serve --contexts kind-kbark-dev,kind-kbark-staging {{.CLI_ARGS}}

  demo-up:
    desc: Create the demo Kind clusters and the healthy baseline
    cmds:
      - demo/demo.sh up

  test:
    desc: Run unit tests
    cmds:
      - go test -race -count=1 ./...

  envtest-setup:
    desc: Download envtest binaries (apiserver, etcd, kubectl) into ./.envtest-bins
    cmds:
      - go install sigs.k8s.io/controller-runtime/tools/setup-envtest@latest
      - |
        ENVTEST_BIN="$(setup-envtest use 1.32 -p path)"
        mkdir -p .envtest-bins
        cp -R "$ENVTEST_BIN"/* .envtest-bins/
        echo "envtest binaries installed in ./.envtest-bins"

  envtest:
    desc: Run the envtest E2E suite (run task envtest-setup once first)
    cmds:
      - go test -race -count=1 -tags=envtest ./internal/kube/...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  fmt:
    desc: Format with gofumpt
    cmds:
      - gofumpt -w .

  tidy:
    desc: Tidy go.mod/go.sum
    cmds:
      - go mod tidy

  vhs:
    desc: Regenerate the README demo gif (placeholder until M9)
    cmds:
      - echo "vhs target wired in M9"

  release-snapshot:
    desc: Build a snapshot release locally (no publish)
    cmds:
      - goreleaser release --snapshot --clean

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf bin/ dist/
